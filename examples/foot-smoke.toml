name    = "foot-smoke"
profile = "plain-hyprland"

[[step]]
id = "no-windows"
do = { session = "! hyprctl clients | grep -q 'class:'" }

[[step]]
id = "hyprctl-version"
do = { hyprctl = ["version"] }

[[step]]
id = "open-foot"
do = { vmkit = ["keys", "meta_l", "q"] }
settle_ms = 1500

  [[step.expect]]
  at = "+100ms..+1200ms"
  check = "changed"
  region = [22, 22, 600, 120]
  min_px = 1000

[[step]]
id = "foot-mapped"
do = { session = "hyprctl clients | grep -q 'class: foot'" }

[[step]]
id = "type"
do = { vmkit = ["type", "echo smoke test done"] }
settle_ms = 1300

  [[step.expect]]
  at = "+300ms..+1200ms"
  anchor = "ack"
  check = "ocr"
  region = [22, 22, 1236, 120]
  text = "echo smoke test"

  [[step.expect]]
  at = "+300ms..+1200ms"
  anchor = "ack"
  check = "ocr"
  region = [22, 22, 1236, 120]
  text = "zebra quartz wombat"
  not = true
