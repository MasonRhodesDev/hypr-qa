name     = "hyprhands-overlay"
profile  = "plain-hyprland"
snapshot = "session-ready"

[guest]
hyprland = { cursor = { no_hardware_cursors = true } }

[[setup]]
push = { src = "../hyprhands/target/release/hyprhands", dst = "/usr/local/bin/hyprhands", mode = "0755" }

[hyprhands]
argv = ["hyprhands", "serve", "--monitor", "Virtual-1"]

[[step]]
id = "baseline"
do = { wait_ms = 300 }

  [[step.expect]]
  at = "+0ms"
  check = "pixel"
  region = [0, 0, 0, 4]
  color = "#00b4ff"
  tolerance = 40
  min_fraction = 0.5
  not = true

[[step]]
id = "click-middle"
do = { hyprhands = { op = "click", x = 640, y = 400 } }
settle_ms = 800

  [[step.expect]]
  at = "+0ms..+500ms"
  anchor = "ack"
  check = "pixel"
  region = [0, 0, 0, 4]
  color = "#00b4ff"
  tolerance = 40
  min_fraction = 0.9

  [[step.expect]]
  at = "+0ms..+200ms"
  anchor = "ack"
  check = "changed"
  region = [600, 360, 80, 80]
  min_px = 200

  [[step.expect]]
  at = "+600ms"
  anchor = "ack"
  check = "pixel"
  region = [600, 360, 80, 80]
  color = "#00b4ff"
  tolerance = 40
  min_fraction = 0.02
  not = true

  [[step.expect]]
  at = "+100ms..+1500ms"
  anchor = "ack"
  check = "ocr"
  region = [0, -120, 0, 120]
  text = "click 640, 400"

  [[step.expect]]
  at = "+0ms..+500ms"
  anchor = "ack"
  check = "template"
  image = "templates/hyprhands-cursor.png"
  near = [640, 400]
  radius = 48
